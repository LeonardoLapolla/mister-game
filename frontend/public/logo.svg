<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <!-- glow radial gradient -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#16C784" stop-opacity="0.36"/>
      <stop offset="78%" stop-color="#16C784" stop-opacity="0"/>
    </radialGradient>
    <!-- hub gradient -->
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#5BE3B0"/>
      <stop offset="100%" stop-color="#16C784"/>
    </linearGradient>
    <!-- inset ring mask (simulates inset box-shadow as inner border) -->
    <mask id="ring-mask">
      <circle cx="54" cy="54" r="50" fill="white"/>
      <circle cx="54" cy="54" r="44" fill="black"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="9" flood-color="#16C784" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- glow background -->
  <circle cx="54" cy="54" r="67" fill="url(#glow)"/>

  <!-- wheel segments (6 × 60°, starting from -90° = top) -->
  <!-- segment 1: primary #16C784, from -90° to -30° -->
  <path d="M54,54 L54,4 A50,50 0 0,1 97.32,29 Z" fill="#16C784"/>
  <!-- segment 2: dark #102a1e, from -30° to 30° -->
  <path d="M54,54 L97.32,29 A50,50 0 0,1 97.32,79 Z" fill="#102a1e"/>
  <!-- segment 3: primary-300 #5BE3B0, from 30° to 90° -->
  <path d="M54,54 L97.32,79 A50,50 0 0,1 54,104 Z" fill="#5BE3B0"/>
  <!-- segment 4: dark #0e2118, from 90° to 150° -->
  <path d="M54,54 L54,104 A50,50 0 0,1 10.68,79 Z" fill="#0e2118"/>
  <!-- segment 5: primary-700 #0FA56C, from 150° to 210° -->
  <path d="M54,54 L10.68,79 A50,50 0 0,1 10.68,29 Z" fill="#0FA56C"/>
  <!-- segment 6: dark #102a1e, from 210° to 270° -->
  <path d="M54,54 L10.68,29 A50,50 0 0,1 54,4 Z" fill="#102a1e"/>

  <!-- outer border ring -->
  <circle cx="54" cy="54" r="50" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="3"/>

  <!-- inset inner border (bg-2 #070A0D) -->
  <circle cx="54" cy="54" r="44" fill="none" stroke="#070A0D" stroke-width="6"/>

  <!-- hub circle -->
  <circle cx="54" cy="54" r="21" fill="url(#hub)" filter="url(#shadow)"/>
  <circle cx="54" cy="54" r="21" fill="none" stroke="rgba(255,255,255,0.40)" stroke-width="1"/>

  <!-- hub "M" label -->
  <text x="54" y="62" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="700" font-size="27" fill="#04130D">M</text>

  <!-- top pointer triangle -->
  <polygon points="54,1 46,13 62,13" fill="#5BE3B0" filter="url(#pointer-glow)"/>
  <defs>
    <filter id="pointer-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#16C784" flood-opacity="0.9"/>
    </filter>
  </defs>
</svg>
